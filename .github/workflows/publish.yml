name: Publish FullPsych

on:
  push:
    branches: [main]
    paths:
      - publish.json
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS context
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fullpsych-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to existing Cloudflare Pages project
        run: npx --yes wrangler@4 pages deploy _site --project-name fullpsych-site --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ed3b0af15e1c2b8a6a351cc929b0a312
